<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Language Resources · Learning Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ivory: #F9F6F0;
            --ink: #112226;
            --teal: #1F5560;
            --teal-light: #EBF2F3;
            --rose: #D63660;
            --rose-light: #FDF0F3;
            --gold: #B8932F;
            --sidebar-width: 320px;
            --shadow: 0 16px 40px -16px rgba(18, 56, 66, 0.15);
            --border-radius: 16px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: "DM Sans", sans-serif;
            background-color: var(--ivory);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
            background:
                radial-gradient(circle 500px at 80% 20%, rgba(31, 85, 96, 0.05), transparent 80%),
                radial-gradient(circle 400px at 40% 90%, rgba(214, 54, 96, 0.04), transparent 80%);
        }

        /* --- LEFT COLUMN / SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #FFFFFF;
            border-right: 1px solid #E6DFD1;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 20;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            overflow-y: auto;
        }

        .teacher-profile {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid #F0EAE1;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            position: relative;
        }

        .avatar-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--teal), #123842);
            color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "DM Serif Display", serif;
            font-size: 2rem;
            font-style: italic;
            box-shadow: 0 8px 20px -6px rgba(31, 85, 96, 0.4);
            border: 3px solid #FFFFFF;
        }

        .avatar-container::after {
            content: '';
            position: absolute;
            bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            background-color: #4F8C66;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
        }

        .welcome-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gold);
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .teacher-name {
            font-family: "DM Serif Display", serif;
            font-style: italic;
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            color: var(--ink);
        }

        .student-note {
            font-size: 0.85rem;
            color: #607175;
            line-height: 1.4;
            margin: 0;
            background: #FDFBF7;
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #E6DFD1;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-group-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #92A1A3;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            text-decoration: none;
            color: #4A595C;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            transition: all 0.2s ease;
            background: #FDFBF7;
            border: 1px solid #EFEAE0;
        }

        .nav-link:hover {
            transform: translateX(4px);
            color: var(--ink);
            background: #F7F4EC;
            border-color: #D6CDBC;
        }

        .nav-link.active-general {
            border-left: 4px solid var(--teal);
            background: var(--teal-light);
            color: var(--teal);
        }

        .nav-link.active-advanced {
            border-left: 4px solid var(--rose);
            background: var(--rose-light);
            color: var(--rose);
        }

            background: #FAF8F5;
            border: 1
